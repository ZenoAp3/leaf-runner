<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Leaf Runner</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0d1f12; overflow: hidden;
    height: 100%; font-family: -apple-system, Arial, sans-serif;
  }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    padding: 10px 12px 0; box-sizing: border-box;
  }
  #topbar {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 6px 10px; color: #d9f5d3; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  #topbar .stat { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #topbar b { color: #ffe27a; }
  #unameLabel { font-size: 18px; font-weight: 700; }
  #topbar button {
    background: rgba(0,0,0,0.4); color: #d9f5d3; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 9px; padding: 9px 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  #score {
    text-align: right; margin-top: 4px;
    color: #b6f2b0; font-size: 20px; font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events: none;
  }
  #hint {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    color: #cfe9c9; font-size: 13px; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    width: 90%;
  }
  #credit {
    margin-top: 6px;
    color: rgba(207, 233, 201, 0.55); font-size: 11px; font-style: italic;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  #nowPlaying {
    margin: 6px auto 0; width: fit-content;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
    color: #d9f5d3; font-size: 11px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15); white-space: nowrap;
    max-width: 78vw; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
  }
  @media (max-width: 400px) {
    #topbar { font-size: 13px; }
    #unameLabel { font-size: 16px; }
    #topbar button { padding: 7px 10px; font-size: 13px; }
    #score { font-size: 17px; }
  }
  #gameover {
    position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%);
    color: #ffffff; text-align: center; display: none;
    text-shadow: 0 2px 4px rgba(0,0,0,0.7);
  }
  #gameover .title { font-size: 26px; font-weight: bold; }
  #gameover .sub { font-size: 15px; margin-top: 8px; color: #cfe9c9; }
  #gameover .coins { font-size: 16px; margin-top: 6px; color: #ffe27a; }
  #gameover .buttons { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  #gameover button {
    background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer;
  }

  .overlay {
    position: absolute; inset: 0; background: rgba(8,18,10,0.92);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  .panel {
    background: #142c1a; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px;
    padding: 22px; width: min(340px, 86%); max-height: 80vh; overflow-y: auto;
    color: #e6f5e2; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
  }
  .panel h2 { margin: 0 0 14px; font-size: 18px; color: #ffe27a; text-align: center; }
  .panel input[type=text] {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.06);
    color: #fff; font-size: 15px; margin-bottom: 12px;
  }
  .panel button.primary {
    width: 100%; padding: 11px; border-radius: 8px; border: none;
    background: #4caf50; color: #08240c; font-weight: bold; font-size: 15px; cursor: pointer;
  }
  .panel button.secondary {
    width: 100%; padding: 9px; border-radius: 8px; margin-top: 8px;
    background: transparent; border: 1px solid rgba(255,255,255,0.25); color: #cfe9c9;
    font-size: 13px; cursor: pointer;
  }
  .lb-row {
    display: flex; justify-content: space-between; padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px;
  }
  .lb-row .rank { color: #8fbf8a; width: 26px; }
  .lb-row .name { flex: 1; }
  .lb-row .pts { color: #ffe27a; font-weight: bold; }
  .lb-status { text-align: center; color: #8fbf8a; font-size: 13px; padding: 12px 0; }
  .pl-row {
    display: flex; align-items: center; justify-content: space-between; padding: 8px 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; gap: 8px;
  }
  .pl-row .name { flex: 1; }
  .pl-row .pts { color: #ffe27a; font-weight: bold; font-size: 12px; }
  .pl-row button {
    background: #b5453f; color: #fff; border: none; border-radius: 7px;
    padding: 6px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .pl-row button:disabled { background: #555; }

  .shop-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 6px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .shop-item .swatch {
    width: 26px; height: 26px; border-radius: 50%; margin-right: 10px; flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.4);
  }
  .shop-item .info { display: flex; align-items: center; flex: 1; font-size: 14px; }
  .shop-item button {
    padding: 7px 12px; border-radius: 8px; border: none; font-size: 12px; cursor: pointer;
    background: #4caf50; color: #08240c; font-weight: bold;
  }
  .shop-item button:disabled { background: #555; color: #aaa; }
  .shop-item button.equipped { background: #ffe27a; }

  .closeX {
    position: absolute; top: 10px; right: 14px; font-size: 20px; color: #cfe9c9; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="topbar">
      <div class="stat">👤 <span id="unameLabel">player</span></div>
      <div class="stat">🪙 <b id="coinLabel">0</b>
        <button id="btnStore">Store</button>
        <button id="btnBoard">Leaderboard</button>
        <button id="btnMute">🔊</button>
        <button id="btnPause">⏸</button>
      </div>
    </div>
    <div id="credit">Inspired By Uni</div>
    <div id="nowPlaying">🎵 —</div>
    <div id="score">0</div>
  </div>
  <div id="hint">TAP / SPACE / UP ARROW to jump &middot; hold to jump higher</div>
  <audio id="bgAudio" preload="none"></audio>

  <div id="gameover">
    <div class="title">GAME OVER</div>
    <div class="sub" id="finalScore">Score: 0</div>
    <div class="coins" id="coinsEarned">+0 coins</div>
    <div class="buttons">
      <button id="btnRestart">Play again</button>
      <button id="btnBoard2">Leaderboard</button>
    </div>
  </div>

  <div class="overlay" id="usernameOverlay">
    <div class="panel">
      <h2>Choose your runner name</h2>
      <input type="text" id="usernameInput" maxlength="16" placeholder="e.g. GreenGoblin">
      <button class="primary" id="usernameSave">Let's go</button>
    </div>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="panel" style="text-align:center;">
      <h2>Ready to run?</h2>
      <button class="primary" id="btnStartPlaying">Start Playing</button>
    </div>
  </div>

  <div class="overlay" id="pauseOverlay">
    <div class="panel" style="text-align:center;">
      <h2>Paused</h2>
      <button class="primary" id="btnResume">Resume</button>
    </div>
  </div>

  <div class="overlay" id="storeOverlay">
    <div class="panel">
      <span class="closeX" data-close="storeOverlay">✕</span>
      <h2>Leaf store</h2>
      <div id="shopList"></div>
      <button class="secondary" data-close="storeOverlay">Close</button>
    </div>
  </div>

  <div class="overlay" id="boardOverlay">
    <div class="panel">
      <span class="closeX" data-close="boardOverlay">✕</span>
      <h2>Global leaderboard</h2>
      <div id="lbList"><div class="lb-status">Loading…</div></div>
      <button class="secondary" data-close="boardOverlay">Close</button>
    </div>
  </div>

  <div class="overlay" id="devOverlay">
    <div class="panel">
      <span class="closeX" data-close="devOverlay">✕</span>
      <h2>🛠 Dev Menu</h2>
      <div style="font-size:13px;color:#8fbf8a;margin-bottom:10px;">Coins</div>
      <input type="text" inputmode="numeric" id="devCoinsInput" placeholder="e.g. 5000">
      <button class="primary" id="devSetCoins">Set Coins</button>
      <div style="font-size:13px;color:#8fbf8a;margin:14px 0 10px;">Best Score</div>
      <input type="text" inputmode="numeric" id="devBestInput" placeholder="e.g. 500">
      <button class="primary" id="devSetBest">Set Best Score</button>
      <div style="font-size:13px;color:#8fbf8a;margin:14px 0 10px;">Score Multiplier (this run)</div>
      <input type="text" inputmode="decimal" id="devMultInput" placeholder="e.g. 3">
      <button class="primary" id="devSetMult">Apply Multiplier</button>
      <button class="secondary" id="devUnlockAll">Unlock All Skins</button>
      <button class="secondary" id="devManagePlayers">Manage Players</button>
      <button class="secondary" data-close="devOverlay">Close</button>
    </div>
  </div>

  <div class="overlay" id="devPlayersOverlay">
    <div class="panel">
      <span class="closeX" data-close="devPlayersOverlay">✕</span>
      <h2>Manage Players</h2>
      <div id="devPlayersList"><div class="lb-status">Loading…</div></div>
      <button class="secondary" data-close="devPlayersOverlay">Close</button>
    </div>
  </div>
</div>
